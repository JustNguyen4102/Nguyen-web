<!DOCTYPE html>
<html>

<head>
    <title>Web của Nguyên</title>

    <style>
        body {
            background-color: #000000;
            text-align: center;
            padding-top: 100px;
            color: #ffffff;
        }

        h1 {
            font-size: 35px;
            font-family: 'Dancing Script', sans-serif;
        }

        .shop {
            position: fixed;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);

            width: 260px;
            height: 420px;

            padding: 15px;

            background: #151922;
            border: 1px solid #3a4355;
            border-radius: 18px;

            box-sizing: border-box;
        }

        .shop h2 {
            color: white;
            text-align: center;
            font-size: 20px;
            margin: 5px 0 15px;
        }

        .upgrade-list {
            height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .upgrade {
            background: #202632;
            border: 1px solid #30394a;
            border-radius: 12px;

            padding: 10px;
            margin-bottom: 10px;

            text-align: center;
        }

        .upgrade h4 {
            color: white;
            margin: 0 0 8px;
            font-size: 15px;
        }

        .bbtn {
            padding: 7px 12px;

            border: none;
            border-radius: 8px;

            background: #4169e1;
            color: white;

            cursor: pointer;
            font-size: 13px;

            transition: 0.2s;
        }

        .bbtn:hover {
            transform: scale(1.05);
            background: #5b7cff;
        }

        .click-area {
            position: relative;
            display: inline-block;

            transition: transform 0.2s ease;

            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
        }

        .click-area:hover {
            transform: scale(1.15);
        }

        .circle {
            width: 180px;
            height: 180px;

            border-radius: 50%;
            overflow: hidden;

            cursor: pointer;

            animation: rotate 8s linear infinite;
        }

        .circle img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .float-point {
            position: absolute;

            color: white;

            font-size: 30px;
            font-weight: bold;

            pointer-events: none;

            animation: flyUp 1.2s ease-out forwards;
        }


        @keyframes flyUp {
            from {
                transform: translate(-50%, -50%);
                opacity: 1;
            }

            to {
                transform: translate(-50%, -100px);
                opacity: 0;
            }
        }
    </style>
</head>


<body>

    <h1 id="score">Điểm: 0</h1>


    <div class="click-area" id="clickArea">
        <div class="circle" id="clickImg">

            <img src="sigma.jfif">
        </div>
    </div>

    <div class="shop">
        <h2>|Shop|</h2>
        <div class="upgrade-list">
            <div class="upgrade">
                <h4 class="upg">+20% điểm thưởng</h4>
                <button class="bbtn">(-150 điểm)</button>
            </div>
            <div class="upgrade">
                <h4 class="upg">+1 điểm khi nhấn</h4>
                <button class="bbtn" id="buyBtn">(-20 điểm)</button>
            </div>
        </div>
    </div>

    <script>

        let score = 0;
        let clickPower = 1;
        let upgradeCost = 20;
        let scoreText = document.getElementById("score");
        let buyBtn = document.getElementById("buyBtn");
        let clickArea = document.getElementById("clickArea");
        let clickImg = document.getElementById("clickImg");

        buyBtn.addEventListener("click", function() {

            if (score >= upgradeCost) {

                score -= upgradeCost;

                clickPower += 1;

                upgradeCost = Math.ceil(upgradeCost * 1.75);

                scoreText.innerText = "Điểm: " + score;

                buyBtn.innerText = "(-" + upgradeCost + " điểm)";
            }

        });

        clickImg.addEventListener("click", function(event) {


            score += clickPower;


            scoreText.innerText = "Điểm: " + score;


            let point = document.createElement("div");


            point.className = "float-point";


            point.innerText = "+" + clickPower;


            clickArea.appendChild(point);


            let rect = clickArea.getBoundingClientRect();


            point.style.left =
                (event.clientX - rect.left) + "px";

            point.style.top =
                (event.clientY - rect.top) + "px";


            setTimeout(function() {

                point.remove();

            }, 1200);

        });

    </script>

</body>

</html>
