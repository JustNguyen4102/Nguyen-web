<!DOCTYPE html>
<html>
<head>
    <title>Web của Nguyên</title>

    <style>
        body {
            background-color: #c5dfe3;
            text-align: center;
            padding-top: 100px;
        }

        h1 {
            font-size: 35px;
            font-family: Poppins, sans-serif;
        }

        .video {
            width: 350px;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }

        .btn {
            padding: 10px 20px;
            margin: 15px 5px;
            border: 1px solid #888;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;

            transition: transform 0.2s ease,
                        background-color 0.3s ease;
        }

        .btn:hover {
            transform: scale(1.3);
            background-color: #dddddd;
        }
    </style>
</head>

<body>

    <h1>Cận cảnh thk gay chơi mai ráp =))</h1>

    <video class="video" autoplay muted loop>
        <source src="video.mp4" type="video/mp4">
    </video>

    <br>

    <button class="btn">Click here!</button>

</body>
</html>
